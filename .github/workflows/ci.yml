name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Binário do MongoDB usado pelos testes de integração (mongodb-memory-server).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build de produção
        run: |
          npm run build --workspace @mente-ativa/shared
          npm run build --workspace @mente-ativa/api
          npm run build --workspace @mente-ativa/web

  e2e:
    name: Testes de ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/mente-ativa-e2e
      JWT_SECRET: ci-e2e-secret
      WEB_ORIGINS: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:3000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run seed --workspace @mente-ativa/api
      - name: Sobe API e front
        run: |
          npm run dev --workspace @mente-ativa/api > api.log 2>&1 &
          npm run dev --workspace @mente-ativa/web > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/v1/health > /dev/null \
              && curl -sf -o /dev/null http://127.0.0.1:5173/login && exit 0
            sleep 1
          done
          echo "Servidores não subiram"; cat api.log web.log; exit 1
      # O runner do GitHub já tem o Google Chrome em /usr/bin/google-chrome.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            api.log
            web.log
