server {
  listen 80;
  root /usr/share/nginx/html;

  # A API roda no serviço "api" (docker-compose.prod.yml), no mesmo endereço do front.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Rotas do React Router: qualquer outro caminho abre o index.html.
  location / {
    try_files $uri /index.html;
  }
}
