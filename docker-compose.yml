services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mente-ativa-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3000
      MONGO_URI: mongodb://mongo:27017/mente-ativa
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - mente-ativa-node-modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
      VITE_SHOW_DEMO_FLAG: 'true'
      VITE_SHOW_DEMO_HINT: 'true'
    ports:
      - '5173:5173'
    depends_on:
      - api
    volumes:
      - .:/app
      - mente-ativa-node-modules:/app/node_modules

volumes:
  mente-ativa-mongo-data:
  mente-ativa-node-modules:
